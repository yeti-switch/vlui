# vlui — an alternative web UI for VictoriaLogs.
#
# This file is the whole configuration. There is no database: sessions live in a
# signed cookie, and everything else is read from here at startup.
#
# Copy it to /opt/vlui/etc/config.yml, fill in the two or three values that are
# deployment-specific, and start the service.

# The address the UI and its API are served on. nginx terminates TLS in front of
# this process, so loopback is the right answer on a host; a container must
# listen on 0.0.0.0 instead.
listen: 127.0.0.1:8080

# Mount the whole app — SPA and API — under a sub-directory, so it can share a
# domain with something else. Empty (the default) serves at the root.
#
# Applied at runtime rather than baked into the build, so the same binary works
# at either. nginx then needs only:
#
#   location /logs/ {
#     proxy_pass http://127.0.0.1:8080;    # no trailing path: keep the prefix
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Proto https;
#     proxy_buffering off;                 # live tailing is a stream
#   }
#
# base_path: /logs

victorialogs:
  # The base URL, without the /select path. A vlselect in a cluster deployment,
  # or a single-node vlogs.
  url: http://127.0.0.1:9428

  # Bounds one query. Generous on purpose: a wide range over a lot of data is a
  # slow query, not a broken one. It also bounds the small endpoints (the
  # histogram, the facets, autocomplete); live tailing is bounded by
  # tail_max_duration below instead.
  timeout: 60s

  # For a VictoriaLogs behind vmauth or any other authenticating proxy.
  # basic_auth:
  #   username: vlui
  #   password: ""

  # The tenant this UI reads, sent as the AccountID / ProjectID headers on every
  # request. Fixed for the process: which tenant is on show is a property of the
  # deployment, not of whoever is looking. To publish two tenants, run two
  # instances — they share nothing, so it costs a systemd unit and a port.
  #
  # 0/0 is the default tenant, which is also the only one a single-tenant
  # install has. It is sent explicitly either way, so a misconfigured proxy
  # cannot silently redirect the read somewhere else.
  # tenant:
  #   account_id: 0
  #   project_id: 0

  # The hard cap on rows in one result set, whatever the UI asks for. The
  # browser has to render these, and the server has to hold what it has not yet
  # flushed — neither should be at the mercy of a typo in the limit box.
  max_rows: 5000

  # What the limit box and the time picker start on.
  default_limit: 500
  default_range: 1h

  # How long one live-tail connection may last before the server ends it. The
  # browser reconnects by itself, so nobody sees the seam; this only stops a tab
  # left open over a weekend from pinning an upstream stream open for the
  # weekend.
  #
  # How much HISTORY a tail opens with is not configured here: the UI sends the
  # window it is showing, and the server trims that history to the row cap
  # before it reaches the browser. So "follow this, from the hour I was looking
  # at" costs the same on a busy stream as on a quiet one.
  tail_max_duration: 1h

# OIDC. Any conformant provider: Keycloak, Authentik, Okta, Entra, Google, or
# anything else that publishes a discovery document — everything but the client
# credentials is read from <issuer>/.well-known/openid-configuration.
auth:
  # Off by default. When off, every request is anonymous, which is only
  # acceptable behind an IP allowlist or on a trusted network — VictoriaLogs
  # holds whatever your applications logged, which is usually more than it looks.
  enabled: false

  issuer: https://idp.example.com/realms/ops
  client_id: vlui
  client_secret: ""

  # Must match what the provider has registered, exactly — including base_path.
  redirect_url: https://logs.example.com/api/auth/callback

  # Signs the session cookie. At least 32 bytes: `openssl rand -hex 32`.
  # Rotating it logs everyone out, which is also how you revoke every session.
  #
  # Leave it EMPTY and one is generated at startup. That is fine for a trial and
  # wrong for a deployment, in two ways:
  #
  #   - every restart signs everyone out — a rolling update, a crash, a config
  #     change;
  #   - two instances generate two secrets, so behind a load balancer a session
  #     made against one is refused by the other, and people are signed out on
  #     some requests and not others.
  #
  # The process logs a warning when it generates one.
  cookie_secret: CHANGEME-32-BYTES-MINIMUM-000000

  # scopes: [openid, profile, email]
  # session_ttl: 12h

  # Bounds every request to the IdP: the discovery document, the JWKS fetch,
  # the token exchange. Ten seconds by default. Without one, a provider that
  # accepts the connection and then says nothing holds the call for as long as
  # the kernel's own retry limit — over two minutes.
  # timeout: 10s
  #
  # DISCOVERY DOES NOT BLOCK STARTUP. It runs in the background and retries
  # until the issuer answers, so an IdP that is down does not stop this app:
  # it starts, serves everyone who already has a session — those are checked
  # against the cookie signature, which owes the IdP nothing — and answers 503
  # with the reason to anyone trying to sign IN. When the provider comes back,
  # logins work again with no restart.

  # Authorisation, as opposed to authentication. Without this, anyone the IdP
  # knows can read every log line this tenant holds. Requires the id_token to
  # carry one of these in groups_claim.
  # allowed_groups: [noc, sre]
  #
  # groups_claim names the claim to read them from. "groups" suits most
  # providers; a dotted path walks nested objects for the ones that do not:
  #
  #   groups_claim: groups                              most providers
  #   groups_claim: urn:zitadel:iam:org:project:roles   Zitadel
  #   groups_claim: resource_access.vlui.roles          Keycloak client roles
  #
  # The shape does not need configuring: an array of strings, an object whose
  # keys are the names (which is what Zitadel sends), or a single string all
  # work.
  #
  # ZITADEL also needs the roles put INTO the token, which is off by default —
  # enable "Assert Roles on Authentication" on the project, or request the
  # urn:zitadel:iam:org:projects:roles scope. Without that the claim is absent
  # and every login is refused for being in no groups.
  #
  # Not sure what your provider sends? Run with -debug and sign in: the claim
  # names in the token, and what was read from the configured one, are logged.
  # groups_claim: groups

  # What "Sign out" means:
  #
  #   local     (default) Drop this app's session only. The IdP session survives,
  #             so signing back in is one click — that is the SSO contract, and
  #             it leaves every other app on the issuer alone.
  #
  #   provider  RP-initiated logout: end the IdP session too, signing the user
  #             out of every app on that IdP. A large blast radius for a button
  #             in a log viewer, hence opt-in. Needs post_logout_redirect_url,
  #             registered with the provider.
  #
  # logout: local
  # post_logout_redirect_url: https://logs.example.com/

  # Only for testing over plain HTTP on localhost.
  # secure_cookie: false

  # For a provider that publishes no discovery document, give the endpoints by
  # hand instead of `issuer`:
  # auth_url:  https://idp.example/authorize
  # token_url: https://idp.example/token
  # jwks_url:  https://idp.example/jwks

# What the browser tab says this is. Both are written into the page when the
# server starts rather than set by the JavaScript, so they are right before the
# app has loaded and on the login page too — which matters when three of these
# are open in three tabs.
#
# ui:
#   title: Yeti production logs
#
#   # A path to an image on THIS host: svg, png, ico, jpeg, gif or webp. Read
#   # once at startup and served from memory, so replacing it needs a restart.
#   #
#   # A local file rather than a URL because the page's Content-Security-Policy
#   # allows images from its own origin only — an icon hosted elsewhere would be
#   # blocked by the browser and the tab would quietly keep the default.
#   favicon: /opt/vlui/etc/logo.svg

# Preset queries, offered in a dropdown next to the query line. Deployment
# knowledge — "how do I find SIP errors here" — belongs with the deployment
# rather than in each operator's browser history.
# queries:
#   - name: SIP errors
#     query: '_stream:{app="sems"} error'
#   - name: Failed calls
#     query: '_stream:{app="yeti-web"} "call failed" | fields _time, _msg, host'

# Tools — the icons down the left rail. Each one scopes the whole session to a
# slice of the logs: its query is applied to the rows, the histogram, the facets,
# autocomplete and live tailing, on top of whatever the operator types.
#
# The filter is shown beside the query input, so what is in force is always on
# screen. It is APPLIED BY THIS SERVER, from the tool's id, on every request —
# never composed in the browser. That distinction is the whole design: /api/* is
# reachable with curl by anyone holding a session cookie, so a filter the SPA
# glued onto the query box would be a suggestion, not a restriction. For the
# same reason a request that names no tool gets the FIRST tool's filter rather
# than an unfiltered read.
#
# It is sent to VictoriaLogs as extra_filters, which it propagates into every
# subquery (| join, | union, :in(...)). A filter merely concatenated onto the
# front of the query would be escapable through a subquery — VictoriaLogs'
# own documentation names extra_filters as the mechanism for access control.
#
# id:      REQUIRED and unique. It IS the URL — the tool is a path segment, so
#          this one is at https://logs.example.com/<id> — and it is what every
#          request sends. Treat it as a name rather than a label: renaming it
#          breaks existing links to that tool.
#
#          Letters, digits, dashes and underscores. Not api, healthz or assets:
#          the server answers those paths itself, so a tool there would be a
#          link that never reaches the UI. Refused at startup rather than
#          silently.
# tooltip: the label shown on hover. Defaults to the id.
# icon:    one of gear, yeti, bolt, bug, chart, cloud, database, globe, lock,
#          phone, server, tag, terminal, window, exchange, paw, clock, cycle,
#          alert. An unknown name fails at startup. The running UI draws all of
#          them, with their names, at /icons.
# letters: up to three characters drawn in place of an icon — "API", "SIP",
#          "DB". Past three or four tools the abstract shapes stop being
#          distinguishable from each other, while three letters of the system's
#          own name need no legend. One or the other, not both.
# query: optional, and may not contain a pipe (it is combined with the
#        operator's query, so a pipe would swallow it).
#
# A tool that defines a query also makes the query box optional: an empty box
# means "everything this tool covers" and is sent upstream as `*`, still bounded
# by the tool's filter and the time range. With no tool filter in force, an
# empty query stays an error.
#
# tools:
#   - id: main
#     tooltip: Everything
#     icon: gear
#
#   - id: yeti
#     tooltip: Yeti Logs
#     icon: yeti
#     query: 'named_tags.system: yeti'
#     # Columns this tool opens with. A default only: whatever the reader
#     # selects afterwards is remembered in their browser and wins, until they
#     # use "reset columns" in the field panel. Omit for _time and _msg.
#     fields: [_time, level, host, _msg]
#
#   - id: http
#     letters: WEB
#     query: 'system: nginx'
#     # An entry can carry a label, which is what the column HEADER shows. A
#     # field name is often far wider than its values —
#     # "payload.response.status_code" is 28 characters of header over three of
#     # data, and the column is sized to whichever is wider — so a long name
#     # costs real width for nothing.
#     #
#     # Only the header is shortened: the field panel and the log entry show
#     # the real name with the label beside it, so nothing becomes unfindable.
#     fields:
#       - _time
#       - _msg
#       - {name: payload.method, label: method}
#       - {name: payload.response.status_code, label: status, style: http_status}
#
#   - id: apilogs
#     # No tooltip: the id is the label. Not `api`: that path is the app's own
#     # API, and /apilogs is what the rail's icon links to.
#     letters: API
#     query: 'system: api'
#
# Named ways of drawing a field's VALUES, referred to by a field's `style:`
# above. A matching value is coloured, so a 500 among two hundred 200s is found
# by eye rather than by reading the column.
#
# Each style says how it draws and which value gets which colour:
#
#   type:  tag   (the default) a small tinted pill around the value. For a
#                CATEGORY — a status, a level, a method: a handful of values,
#                read as a badge.
#          text  the value itself, coloured. For a MEASUREMENT that is merely
#                alarming past some point. A column of pills around numbers
#                reads as a set of categories it is not, and the digits stop
#                lining up.
#
#   rules: tried IN ORDER, first match wins — the only precedence there is.
#
# A rule carries exactly one matcher:
#
#   value:   the value, exactly. One, or a list of them.
#   range:   "200-399", inclusive, for values that are numbers. A value that is
#            not a number does not match. Either end may be left off, which is
#            what a threshold looks like: "1000-" is everything from a thousand
#            up, "-100" everything to a hundred.
#   prefix:  values that start with it.
#   default: everything the rules above did not match. Last rule only.
#
# and a colour, by name: ok, warn, error, info, neutral or muted. Names rather
# than hex because the UI has a light and a dark theme, and a colour that reads
# in one is unreadable in the other; each name resolves to that theme's own.
# A value no rule matches is drawn as plain text, so the presence of a colour
# means something as well as its hue.
#
# A rule may also carry a `description:`, which appears under the value in the
# cell's tooltip. The colour says a value is worth attention; the description
# says why, which is the half a colour cannot carry — "429" is a question the
# deployment already knows the answer to. Optional: a tooltip that repeats what
# the value already says is noise.
#
# And a `text:`, which is shown IN PLACE of the value: for ids that mean
# something to the system that logged them and nothing to the reader. A rule
# with a text needs no colour — without one the text is drawn plain. The logged
# value stays in the tooltip and in the log entry, and filters still use it.
#
# Anything else — an unknown colour or type, a range written backwards, a
# `style:` naming one that does not exist — is refused at startup rather than
# showing up as an uncoloured value three screens into a result set.
#
# value_styles:
#   # What yeti-web's API log has always done: 2xx-3xx green, 4xx amber, 5xx red.
#   http_status:
#     rules:
#       - {range: 200-399, color: ok}
#       - {range: 400-499, color: warn, description: rejected — the request was wrong}
#       - {range: 500-599, color: error, description: the application failed}
#
#   level:
#     rules:
#       - {value: [error, fatal], color: error}
#       - {value: warn, color: warn}
#       - {value: info, color: ok}
#       - {default: true, color: neutral}
#
#   # A threshold rather than bands, and no upper bound to be exceeded.
#   slow:
#     type: text
#     rules:
#       - {range: 1000-, color: error}
#       - {range: 250-999, color: warn}
#
#   # Ids shown as names, uncoloured.
#   pop:
#     rules:
#       - {value: "1", text: Frankfurt}
#       - {value: "2", text: Amsterdam}
#
# used as:
#
#   fields:
#     - {name: payload.status, label: status, style: http_status}
#     - {name: duration, style: slow}
#     - {name: pop_id, label: pop, style: pop}

# IS THIS ACCESS CONTROL? Only if you make it so. By default every signed-in
# account may select every tool, which is right when the rail is a set of
# shortcuts — anyone can switch to the widest one, exactly as they could type
# its query by hand.
#
# To make it a boundary, two things have to be true:
#
#   1. There is no unrestricted tool for someone to switch to — or the ones that
#      are wide carry allowed_groups.
#   2. The first tool is a safe default, since that is what a request naming no
#      tool receives.
#
# allowed_groups requires auth.enabled and matches the same claim as
# auth.groups_claim. A tool the account may not use is refused (403) AND left
# out of /api/config, so it never appears in their rail:
#
#   - id: billing
#     icon: lock
#     query: 'system: billing'
#     allowed_groups: [billing, admin]
#
# Note what this still is not: a restriction on WHICH LOGS EXIST. Anyone who can
# reach VictoriaLogs directly is unaffected by any of it — keep it on loopback
# or behind vmauth.

# The built-in Prometheus exporter, on its own socket. Never a route on the app:
# that one sits behind OIDC and may sit under base_path, and a scraper should
# have to care about neither. Nothing but metrics is served here.
#
# Worth alerting on:
#
#   # VictoriaLogs failing. NOT status!="ok" — that includes the 400 it returns
#   # for a mistyped LogsQL query, which would page somebody for a typo.
#   - alert: VictoriaLogsErrors
#     expr: rate(vlui_vl_requests_total{status=~"error|5.."}[5m]) > 0
#
#   # VictoriaLogs is unreachable. Only exported when probe_interval is set.
#   - alert: VictoriaLogsDown
#     expr: vlui_vl_up == 0
#
# Ready-made rules for all of this are in deploy/alerts/vlui.yml.
#
# Also exported: http_requests_total{route,status}, http_request_duration_seconds,
# vl_request_duration_seconds, query_rows_total, query_bytes_total,
# queries_active, tail_sessions_active, build_info, and the usual
# go_*/process_* series.
metrics:
  # Naming an address is what turns the exporter on. Everything below it is read
  # only when this is set.
  listen: 127.0.0.1:9108
  path: /metrics

  # How often VictoriaLogs is pinged to keep vlui_vl_up fresh.
  #
  # It exists because the gauge has to mean something on an idle instance:
  # updated only by user queries, it would report the state of whenever somebody
  # last looked. Probing on scrape instead would be worse — a hung VictoriaLogs
  # would hang the scrape and take every other metric down with it, exactly when
  # they are needed.
  #
  # Set it to 0 to disable both the probe and the gauge, and alert on
  # rate(vlui_vl_requests_total{status=~"error|5.."}[5m]) instead.
  probe_interval: 15s
