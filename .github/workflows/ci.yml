name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CGO_ENABLED is deliberately NOT set job-wide. The two Go steps want opposite
# values, and a shared default would quietly break one of them:
#
#   - the race detector is implemented in cgo, so `go test -race` needs 1;
#   - the shipped binary must be static (distroless has no libc), so `go build`
#     needs 0.

jobs:
  frontend:
    name: SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `npm run build` runs vue-tsc --noEmit first, so this is the type check
      # and the build in one.
      - run: npm run build
        working-directory: web

      # The Go build embeds web/dist, so hand it over rather than building the
      # SPA twice.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          retention-days: 1

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go:embed fails outright without web/dist, so the SPA must land first.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: web/dist

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race, not plain: the live tail reads its upstream on one goroutine and
      # writes the response on another, which is exactly the kind of thing a
      # serial test never exercises.
      - name: go test -race
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: 1

      # Static, as it ships: distroless/static has no libc, so a cgo-linked
      # binary would build here and then fail to start in the container.
      - name: build
        run: go build -o vlui ./cmd/vlui
        env:
          CGO_ENABLED: 0

      # The SPA is embedded, so a binary that cannot serve its own index.html is
      # broken even though it compiled.
      #
      # /dev/null is the defaults, and the defaults now include NO exporter — so
      # this also pins that: a stray listener on 9108 here would mean the
      # opt-in became opt-out again.
      - name: smoke test the defaults
        run: |
          ./vlui -config /dev/null &
          pid=$!
          sleep 2

          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
          health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
          # Exit code, not %{http_code}: curl still prints 000 for a
          # connection that was refused, so a string comparison on its output
          # would be testing the wrong thing.
          exporter_answered=no
          if curl -s --max-time 3 -o /dev/null http://127.0.0.1:9108/metrics; then
            exporter_answered=yes
          fi
          kill $pid || true

          if [ "$code" != "200" ]; then
            echo "::error::the embedded SPA did not serve (HTTP $code)"; exit 1
          fi
          if [ "$health" != "200" ]; then
            echo "::error::/healthz answered $health"; exit 1
          fi
          if [ "$exporter_answered" = "yes" ]; then
            echo "::error::something answered on 9108 — the exporter must be off by default"; exit 1
          fi

      # And that it comes back when asked for. A separate listener is easy to
      # break in a way the app's own port cannot show.
      - name: smoke test the exporter
        run: |
          printf 'metrics:\n  listen: 127.0.0.1:9108\n' > metrics.yml
          ./vlui -config metrics.yml &
          pid=$!
          sleep 2
          metrics=$(curl -sS --max-time 3 http://127.0.0.1:9108/metrics || true)
          kill $pid || true
          echo "$metrics" | grep -q '^vlui_build_info' \
            || { echo "::error::the exporter served no vlui_ metrics"; exit 1; }

      # -version must answer without a config and without opening a socket: it
      # is what a postinst and a bug report both reach for.
      - name: version flag
        run: ./vlui -version

      # A malformed config must fail loudly at startup rather than half-starting
      # on defaults.
      - name: rejects a bad config
        run: |
          printf 'victorialogs:\n  url: not-a-url\n' > bad.yml
          set +e; out=$(./vlui -config bad.yml 2>&1); rc=$?; set -e
          [ "$rc" = "1" ] || { echo "::error::rc=$rc, want 1"; echo "$out"; exit 1; }
          echo "$out" | grep -q 'victorialogs.url' \
            || { echo "::error::the error does not name the offending key: $out"; exit 1; }

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint chart
        run: helm lint charts/vlui

      # Rendering is not enough on its own: the interesting failures are in the
      # combinations. Each of these has burned someone —
      #   base_path        the probes and the HTTPRoute path must follow it
      #   metrics disabled no container port, no Service port, no PodMonitor
      #   existingConfigMap  no rendered ConfigMap, and no checksum annotation
      - name: Render every combination
        run: |
          set -e
          helm template t charts/vlui > /dev/null
          helm template t charts/vlui --set config.base_path=/logs > /dev/null
          helm template t charts/vlui --set config.metrics.listen="" > /dev/null
          helm template t charts/vlui --set existingConfigMap=my-config > /dev/null
          helm template t charts/vlui \
            --set podMonitor.enabled=true \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=external' \
            --set 'httpRoute.hostnames[0]=logs.example.com' \
            --set podDisruptionBudget.enabled=true > /dev/null
          # The redirect route, which is a second HTTPRoute on the plaintext
          # listener.
          helm template t charts/vlui \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=external' \
            --set 'httpRoute.redirParentRefs[0].name=external' \
            --set 'httpRoute.redirParentRefs[0].sectionName=http' > /dev/null

      # The guards must actually fire. A validation that stopped working would
      # otherwise be invisible until it let a broken release through.
      - name: Refuse the configurations that cannot work
        run: |
          fails() {
            if helm template t charts/vlui "$@" > /dev/null 2>&1; then
              echo "::error::expected a failure from: $*"; exit 1
            fi
          }
          # An HTTPRoute with no Gateway routes nothing.
          fails --set httpRoute.enabled=true
          # Nothing to scrape.
          fails --set podMonitor.enabled=true --set config.metrics.listen=""
          # A rule cannot both redirect and have a backend; Gateway API rejects
          # it, so the chart should too rather than deferring to the API server.
          fails --set httpRoute.enabled=true \
                --set 'httpRoute.parentRefs[0].name=g' \
                --set 'httpRoute.filters[0].type=RequestRedirect' \
                --set 'httpRoute.filters[0].requestRedirect.scheme=https'
          # A redirect with nothing serving https to redirect TO.
          fails --set 'httpRoute.redirParentRefs[0].name=g'
          # Authentication that cannot work.
          fails --set config.auth.enabled=true
          fails --set config.auth.enabled=true \
                --set config.auth.issuer=https://idp \
                --set config.auth.redirect_url=https://x/api/auth/callback \
                --set config.auth.cookie_secret=tooshort

      - uses: yannh/kubeconform-action@v1
        with:
          args: >-
            -strict -summary
            -kubernetes-version 1.31.0
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        continue-on-error: true

      # The one that catches the most: config.Load runs with KnownFields, so any
      # key the chart writes that the binary does not know is a CrashLoopBackOff
      # rather than a warning. Rendering the chart's config and feeding it to the
      # real binary is the only thing that proves the two agree.
      - name: The rendered config must load in the binary
        run: |
          set -e
          mkdir -p web/dist && touch web/dist/.gitkeep
          CGO_ENABLED=0 go build -o vlui ./cmd/vlui

          check() {
            helm template t charts/vlui "$@" \
              | awk '/^  config.yml: \|/{flag=1;next} /^[^ ]/{flag=0} flag{sub(/^    /,"");print}' \
              > rendered.yml
            test -s rendered.yml || { echo "::error::no config rendered for: $*"; exit 1; }
            # -check-config parses and validates, touching no network.
            ./vlui -config rendered.yml -check-config || {
              echo "::error::the binary rejected the chart's config for: $*"; cat rendered.yml; exit 1;
            }
          }

          check
          check --set config.base_path=/logs
          check --set config.metrics.listen=""
          check --set 'config.tools[0].tooltip=main' --set 'config.tools[0].icon=gear' \
                --set 'config.tools[1].tooltip=Yeti' --set 'config.tools[1].icon=yeti' \
                --set 'config.tools[1].query=named_tags.system:yeti'
