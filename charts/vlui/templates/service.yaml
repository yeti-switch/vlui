apiVersion: v1
kind: Service
metadata:
  name: {{ include "vlui.fullname" . }}
  labels:
    {{- include "vlui.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vlui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if include "vlui.metricsPort" . }}
    # Present for a human with kubectl port-forward. Prometheus does not use it:
    # the PodMonitor scrapes pods directly, which is also why a Service in front
    # of several replicas cannot round-robin a scrape to the wrong one.
    - name: metrics
      port: {{ include "vlui.metricsPort" . }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
